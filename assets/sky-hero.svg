<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="396" viewBox="0 0 1080 396">
  <title>Morning dispatch over the sea</title>
  <desc>A folded paper plane crossing coral morning sunlight over a mountain coast.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1=".1" x2=".95" y2=".86" gradientUnits="objectBoundingBox">
      <stop stop-color="#132145"/>
      <stop offset=".39" stop-color="#22395c"/>
      <stop offset=".72" stop-color="#517ca0"/>
      <stop offset="1" stop-color="#998aa6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5d8ca3"/>
      <stop offset="1" stop-color="#263e67"/>
    </linearGradient>
    <linearGradient id="fade" x2=".95" y2="0">
      <stop stop-color="#111f43" stop-opacity=".59"/>
      <stop offset=".58" stop-color="#15264a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#18264a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset=".25" stop-color="#ffe2ba" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#e9b6bd" stop-opacity=".29"/>
      <stop offset="1" stop-color="#b7bfd3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1=".12" y1="1" x2=".76" y2="0">
      <stop stop-color="#df94b2"/>
      <stop offset=".55" stop-color="#f7bcc0"/>
      <stop offset="1" stop-color="#ffe0b9"/>
    </linearGradient>
    <linearGradient id="planeTop" x1=".18" y1="0" x2=".81" y2="1">
      <stop stop-color="#fff3e5"/>
      <stop offset=".52" stop-color="#f4ebec"/>
      <stop offset="1" stop-color="#9fcddc"/>
    </linearGradient>
    <linearGradient id="planeFold" x1=".25" y1=".05" x2=".85" y2=".95">
      <stop stop-color="#a6d5e0"/>
      <stop offset=".65" stop-color="#7499be"/>
      <stop offset="1" stop-color="#465a8a"/>
    </linearGradient>
    <linearGradient id="headland" x2=".82" y2="1">
      <stop stop-color="#465984"/>
      <stop offset=".7" stop-color="#283f68"/>
      <stop offset="1" stop-color="#1e2c53"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1080" height="396"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Morning sky and sea, with room for printable titles on the left -->
    <rect width="1080" height="396" fill="url(#sky)"/>
    <ellipse cx="864" cy="153" rx="313" ry="293" fill="url(#halo)"/>
    <circle cx="845" cy="166" r="142" fill="none" stroke="#f6ddd0" stroke-opacity=".27" stroke-width="1.2"/>
    <circle cx="845" cy="166" r="124" fill="url(#sun)"/>
    <path d="M707 127h113m59-10h92m-73 37h128m-315 43h104m70 10h101m-209 25h113m-248-88h70"
          fill="none" stroke="#ffdcce" stroke-opacity=".46" stroke-width="2" stroke-linecap="round"/>

    <path d="M0 215c153-14 222 19 393 6 84-7 144-34 224-28 54 4 91 7 150-8 66-17 82-33 120-27 47 7 104 3 193-18v27c-122 13-208 8-298 44-87 35-136-3-214 23-175 59-276 37-372 25C101 248 55 251 0 260z" fill="#a8b1c7" opacity=".17"/>
    <path d="M371 101c56 2 102-24 165-32 47-6 125 5 180-21 30-14 66-21 118-17-63 7-72 24-115 36-82 23-121 5-190 21-43 9-90 30-158 13z" fill="#b7cada" opacity=".18"/>
    <path d="M87 308c100-11 175-35 249-24 106 16 170 4 242-16 83-23 160-14 235-21-47 9-127 16-194 36-109 32-222 39-314 24-77-13-157 4-218 1z" fill="#e1a8be" opacity=".26"/>
    <path d="M919 64c57 0 99-10 155-37m-45 48 42-11M535 123c41-5 59-15 97-15m-186 24 48-4"
          stroke="#cadceb" stroke-opacity=".37" fill="none" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M0 346h1080v50H0z" fill="url(#water)"/>
    <path d="M424 346c78-6 152-12 199-26 41-12 55-26 76-28 27-4 45 16 72 17 57 2 103-36 158-27 31 5 63 23 98 24 22 1 39-8 53-8v52H424z" fill="#596988" opacity=".72"/>
    <path d="M361 353c141-5 216-21 272-27 54-5 92 13 146 10 81-5 154-15 195-10 38 4 77 10 106 4v28z" fill="#3e587e" opacity=".83"/>
    <path d="M0 363c161 1 288-7 414-3 145 4 277 10 399-2 95-9 177-7 267 3v35H0z" fill="#354d73" opacity=".6"/>
    <path d="M181 370h203m-162 13h90m164-8h109m-89 11h158m65-21h87m117 12h88m-105 10h172"
          fill="none" stroke="#afd2d9" stroke-opacity=".27" stroke-width="1.4" stroke-linecap="round"/>
    <rect width="760" height="396" fill="url(#fade)"/>
    <path d="M35 35h38m-19 8h19m445-5h44m-34 12h11m-3 255h36m-52 8h26m-532 41c136 4 299-11 441-39" fill="none" stroke="#b6cced" stroke-opacity=".19" stroke-width="1" stroke-linecap="round"/>
    <path d="M632 68q13-12 23-5 4-9 15-10m-75 29q11-7 18-3 4-7 12-7" fill="none" stroke="#e7dce4" stroke-opacity=".7" stroke-width="1.5" stroke-linecap="round"/>
    <g fill="#f6e2e4">
      <circle cx="581" cy="61" r="1.5" opacity=".7"/>
      <circle cx="606" cy="47" r="2" opacity=".75"/>
      <circle cx="678" cy="112" r="2.1" opacity=".75"/>
      <circle cx="1010" cy="97" r="1.9" opacity=".73"/>
      <circle cx="1032" cy="127" r="1.2" opacity=".85"/>
      <circle cx="593" cy="233" r="1.8" opacity=".45"/>
      <circle cx="649" cy="265" r="2" opacity=".57"/>
      <circle cx="630" cy="278" r="1.4" opacity=".57"/>
      <path d="M996 80q2 6 7 7-5 2-7 7-1-5-7-7 6-1 7-7zm-363 81q2 3 6 5-4 1-6 6-2-5-6-6 4-2 6-5z" opacity=".77"/>
    </g>

    <!-- A nearer headland provides scale under the airborne page -->
    <path d="M707 396c32-16 49-21 68-23 39-3 76-15 110-29 17-7 51-10 73-27 17-13 31-28 51-31 20-4 46-3 71-20v130Z"
          fill="url(#headland)"/>
    <path d="M817 396c37-18 72-21 107-32 36-12 53-35 79-40 26-6 49-5 77-15v87Z" fill="#304366"/>
    <path d="M830 394c26-11 58-15 87-25 35-12 66-32 85-34 24-2 51-6 78-16"
          fill="none" stroke="#6088a8" stroke-opacity=".56" stroke-width="1.5"/>
    <path d="M961 319c19-13 33-29 51-31 25-3 46-10 68-23" fill="none" stroke="#af9cb5" stroke-opacity=".48" stroke-width="1.5"/>

    <!-- Wind trails rise with the fold of the main paper plane -->
    <path d="M585 299c84-18 209-40 317-135M616 320c122-26 219-66 302-147M690 321c95-28 145-56 233-127"
          stroke="#d8e2ef" stroke-opacity=".32" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M697 267c71-24 104-37 153-65m-84 84c23-10 42-19 59-29m-223 54 27-7"
          stroke="#f1e4ec" stroke-opacity=".64" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M658 241q17-10 33-12m286-56q36-25 53-50M590 262l19-8" stroke="#a8cedb" stroke-opacity=".44" stroke-width="1.3" stroke-linecap="round" fill="none"/>

    <!-- Main folded newspaper, carrying the same paper-plane motif as the logo -->
    <g transform="translate(626 33) scale(.91)">
      <path d="M38 245 374 74q4-2 3 4l-67 205q-2 6-8 4l-71-33-41 54q-4 4-6-1l-26-78-113 28q-12 2-7-12z"
            fill="#374362" opacity=".33" transform="translate(5 10)"/>
      <path d="M36 237 371 69q5-2 4 3l-66 206q-2 6-8 4l-70-32-41 54q-4 4-6-1l-26-77-113 27q-9 2-12-4-2-7 3-12z"
            fill="url(#planeTop)" stroke="#dce9e9" stroke-width="2" stroke-linejoin="round"/>
      <path d="M371 69 158 226l26 77q2 5 6 1l41-54z" fill="url(#planeFold)" stroke="#a7c8d9" stroke-width="1.35" stroke-linejoin="round"/>
      <path d="M371 69 231 250l-41 54 21-78z" fill="#627caa"/>
      <path d="M371 69 211 226l90 56q6 2 8-4z" fill="url(#planeTop)" stroke="#deaeb9" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M235 228 273 194l32 16-14 47z" fill="#de8e9f" opacity=".89"/>
      <path d="M287 181l46-40m-34 48 26-24m-14 29 9-9" fill="none" stroke="#6e91b0" stroke-width="3.25" stroke-linecap="round" opacity=".82"/>
      <path d="M36 238 371 70M46 250l111-24 203-149"
            fill="none" stroke="#fff4e8" stroke-opacity=".62" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M213 228l87 50q6 3 9-1" fill="none" stroke="#e6f5f8" stroke-opacity=".64" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- A distant second plane and a few small wing-shaped cloud traces -->
    <path d="m937 61 75-30-21 38-17-7-11 8-2-12z" fill="#e6e0e9" opacity=".63"/>
    <path d="m1012 31-51 27 2 12 11-8z" fill="#a4b5cb"/>
    <path d="M926 68l29-8m-14 19 14-4m67 108q10-7 19-4 3-5 10-7m-54 27q9-7 18-4 4-6 12-7"
          stroke="#eadbe7" stroke-opacity=".53" stroke-width="1.35" stroke-linecap="round" fill="none"/>
    <path d="M762 324q13-17 30-20-3 15-23 23l-11 7 9-9z" fill="#eaa9b5" opacity=".74"/>
    <path d="M766 329q12-14 24-22" fill="none" stroke="#f9d3d2" stroke-width="1.15" stroke-opacity=".78" stroke-linecap="round"/>

    <!-- Foreground breeze and glints -->
    <g fill="none" stroke-linecap="round">
      <path d="M612 333q57-28 115-30m244-66q60-17 99-52" stroke="#f0cad1" stroke-opacity=".34" stroke-width="1.4"/>
      <path d="M650 349q25-10 60-14m254-87q35-11 53-23" stroke="#e9d7db" stroke-opacity=".57" stroke-width="1.35"/>
      <path d="M1012 292q10-15 30-17m-439 66q21-10 38-12" stroke="#9cc6df" stroke-opacity=".59" stroke-width="1.35"/>
    </g>
    <path d="M693 288q8-7 13-6-7 8-13 6zm313-78q5-5 11-3-4 5-11 3zm36 98q7-7 11-5-5 6-11 5z" fill="#f7d2d3" fill-opacity=".8"/>
    <path d="M705 347q2 3 5 4-3 1-5 5-1-4-5-5 4-1 5-4zm344-127q2 3 5 4-4 2-5 5-2-4-5-5 3-1 5-4z" fill="#f8d7d5" fill-opacity=".83"/>
  </g>
</svg>
